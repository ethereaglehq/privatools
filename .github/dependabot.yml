version: 2
updates:
  # Minor and patch updates arrive as one PR per run, as the uv ecosystem's do.
  # Majors still arrive one per PR, each needing its own checks, and the ignore
  # rules below hold the known migrations. Without the group, each run filled
  # the five open-PR slots with single-package PRs, and because a PR merges
  # only on a head that includes current main, every merge meant rebasing the
  # others and rerunning their CI. Runs come weekly and also whenever this file
  # changes on main. Weekly is kept: Dependabot security updates are off for
  # this repository, so this schedule is also how patched versions arrive, and
  # a longer interval would delay them and put more changes into each group.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # A React major has to move as one: react, react-dom, @types/react and
      # @types/react-dom together, with every React-dependent library checked
      # in a browser. Dependabot offered react-dom 19 and @types/react-dom 19
      # alone (#214), which cannot even install against react 18. A dedicated
      # upgrade task does that; delete these four entries when it starts.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 6 and later add the React Compiler rules to
      # the recommended set this config spreads in. Here they report 77 errors
      # in 54 files (set-state-in-effect, refs, purity, use-memo,
      # static-components), core hooks such as useMultiFileProcessor among
      # them. Fixing those is a behavioural refactor that needs its own task and
      # browser checks; switching the rules off to go green is not an option
      # (#213). Delete this entry when that task starts.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # ESLint 10 waits for that same task. eslint-plugin-react-hooks declares
      # ESLint 10 support only from 7 (5.x and 6.x stop at ESLint 9), so #238
      # failed npm ci with ERESOLVE, and forcing the peer range would lint with
      # an unsupported combination. @eslint/js 10 requires ESLint 10, so it
      # moves with it. typescript-eslint 8.70 and eslint-plugin-react-refresh
      # 0.5.7 already support ESLint 10. Delete these two entries when the
      # eslint-plugin-react-hooks 7 task starts.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Tailwind CSS 4 is a migration, not a version bump. Its PostCSS plugin
      # moved to @tailwindcss/postcss, so #229 failed the build as it stood.
      # Configuration moves from tailwind.config.ts into CSS, and v4 renames or
      # removes utilities used across this UI (outline-none, shadow-sm,
      # rounded-sm, flex-shrink-*), so pages can render differently even once
      # the build passes. tailwind-merge 3 supports only Tailwind 4
      # (tailwind-merge 2 is the Tailwind 3 line), so it has to move in the
      # same change. A dedicated task does that with visual checks of Air and
      # Play; delete these two entries when it starts.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # pdf.js 6 removes APIs the PDF tools call, such as
      # PDFDocumentProxy.destroy and the isEvalSupported option, so #234 failed
      # the type-check with 16 errors. Moving to it touches every tool that
      # renders or reads PDFs in the browser and needs those tools checked in a
      # real browser, so a dedicated task does it; delete this entry when it
      # starts. 5.x minors are held too. Every release from 5.6.83 to before
      # 6.2.108 is affected by GHSA-hq66-cqwq-w95j (CVE-2026-16633, high:
      # script in a malicious PDF runs when pdf.js scripting is on), and 5.6
      # and 5.7 are the only newer 5.x lines. 5.7 also removes isEvalSupported,
      # so #253 failed the type-check. 5.5.207 stays until that task moves
      # straight to 6.2.108 or later.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The root requirements*.in files, compiled by `uv pip compile` into the
  # hashed requirements*.txt locks that the image and CI install. The pip
  # ecosystem edited the .in pins and left the locks alone, so every one of its
  # PRs failed test_requirements_lock_sync and could never be merged. The uv
  # ecosystem reruns the compile command from each lock's header instead.
  # Minor and patch updates arrive as one PR: each regenerates the same locks,
  # so separate PRs would conflict with each other after every merge.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # init, analyze and upload-sarif must run the same CodeQL Action version:
    # analyze refuses a configuration written by a different init. Proposed one
    # at a time, init alone moved to v4 in #148 and failed both CodeQL jobs.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The Dockerfile's two base images are pinned by digest (see the comment
  # there). A digest pin is only safe if something moves it forward — without
  # this ecosystem the bases would silently freeze on whatever CVEs they carry
  # at pin time, which is strictly worse than tracking the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Moving to another Python is a migration, not a base-image refresh: the
      # locks are compiled for the image's Python and CI tests on the same one.
      # Without this rule Dependabot only ever targets the newest
      # python:X.Y-slim tag. #104 proposed 3.14-slim and was closed, so every
      # weekly run from 2026-09-03 logged "Pull request #104 already exists for
      # python with latest version 3.14-slim" and proposed nothing, not even a
      # new 3.12-slim digest. Ignoring minor and major updates keeps the
      # current tag as the target, so its digest refreshes get proposed.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
