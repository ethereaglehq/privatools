version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A React major has to move as one: react, react-dom, @types/react and
      # @types/react-dom together, with every React-dependent library checked
      # in a browser. Dependabot offered react-dom 19 and @types/react-dom 19
      # alone (#214), which cannot even install against react 18. A dedicated
      # upgrade task does that; delete these four entries when it starts.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 6 and later add the React Compiler rules to
      # the recommended set this config spreads in. Here they report 77 errors
      # in 54 files (set-state-in-effect, refs, purity, use-memo,
      # static-components), core hooks such as useMultiFileProcessor among
      # them. Fixing those is a behavioural refactor that needs its own task and
      # browser checks; switching the rules off to go green is not an option
      # (#213). Delete this entry when that task starts.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]

  # The root requirements*.in files, compiled by `uv pip compile` into the
  # hashed requirements*.txt locks that the image and CI install. The pip
  # ecosystem edited the .in pins and left the locks alone, so every one of its
  # PRs failed test_requirements_lock_sync and could never be merged. The uv
  # ecosystem reruns the compile command from each lock's header instead.
  # Minor and patch updates arrive as one PR: each regenerates the same locks,
  # so separate PRs would conflict with each other after every merge.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # init, analyze and upload-sarif must run the same CodeQL Action version:
    # analyze refuses a configuration written by a different init. Proposed one
    # at a time, init alone moved to v4 in #148 and failed both CodeQL jobs.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The Dockerfile's two base images are pinned by digest (see the comment
  # there). A digest pin is only safe if something moves it forward — without
  # this ecosystem the bases would silently freeze on whatever CVEs they carry
  # at pin time, which is strictly worse than tracking the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Moving to another Python is a migration, not a base-image refresh: the
      # locks are compiled for the image's Python and CI tests on the same one.
      # Without this rule Dependabot only ever targets the newest
      # python:X.Y-slim tag. #104 proposed 3.14-slim and was closed, so every
      # weekly run from 2026-09-03 logged "Pull request #104 already exists for
      # python with latest version 3.14-slim" and proposed nothing, not even a
      # new 3.12-slim digest. Ignoring minor and major updates keeps the
      # current tag as the target, so its digest refreshes get proposed.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
